<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos - MATH LAB</title>

    <link rel="stylesheet" href="lab.css">
</head>

<body>

    <div class="imagem">
        <img src="logo.png" alt="Logo">
    </div>

    <header>
        <h1>MATH LAB</h1>
        <p>Jogos Matemáticos</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="equipe html.html">Equipe</a>
        <a href="jogos.html">Jogos</a>
        <a href="praticos.html">Estudos</a>
    </nav>

    <h1>Jogos Matemáticos</h1>

    <section id="jogos">

        <div class="membro">
            <img src="xadrez.png">
            <h3>Xadrez</h3>

            <button class="game-button" onclick="toggleGame('game1')">
                Jogar
            </button>

            <div id="game1" class="game-container">
                <iframe src="https://www.chess.com/pt-BR"></iframe>
                <button class="close-button" onclick="toggleGame('game1')">
                    Fechar
                </button>
            </div>

            <p>Ajuda no raciocínio lógico e estratégia.</p>
        </div>

        <div class="membro">
            <img src="sudoku.jpeg">
            <h3>Sudoku</h3>

            <button class="game-button" onclick="toggleGame('game2')">
                Jogar
            </button>

            <div id="game2" class="game-container">
                <iframe src="https://www.sudokuonline.io/pt/"></iframe>

                <button class="close-button" onclick="toggleGame('game2')">
                    Fechar
                </button>
            </div>

            <p>Desenvolve concentração e lógica.</p>
        </div>

    </section>

    <script>
        function toggleGame(id) {
            let game = document.getElementById(id);

            game.style.display =
                game.style.display === "block"
                ? "none"
                : "block";
        }
    </script>

    <footer>
        <p>© 2026 MATH LAB</p>
    </footer>

</body>
