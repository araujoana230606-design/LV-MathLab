<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estudos - MATH LAB</title>

    <link rel="stylesheet" href="lab.css">
</head>

<body>

    <div class="imagem">
        <img src="logo.png" alt="Logo">
    </div>

    <header>
        <h1>MATH LAB</h1>
        <p>Atividades Práticas</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="equipe html.html">Equipe</a>
        <a href="jogos.html">Jogos</a>
        <a href="praticos.html">Estudos</a>
    </nav>

    <h1>Atividades para Estudos</h1>

    <section id="praticos">

        <div class="membro">
            <img src="geoplano.jpg">

            <h3>Geoplano</h3>

            <button class="game-button" onclick="toggleGame('p1')">
                Abrir
            </button>

            <div id="p1" class="game-container">
                <iframe src="https://apps.mathlearningcenter.org/geoboard/"></iframe>

                <button class="close-button" onclick="toggleGame('p1')">
                    Fechar
                </button>
            </div>

            <p>Ferramenta para geometria e áreas.</p>
        </div>

        <div class="membro">
            <img src="pitagoras.png">

            <h3>Teorema de Pitágoras</h3>

            <button class="game-button" onclick="toggleGame('p2')">
                Abrir
            </button>

            <div id="p2" class="game-container">
                <iframe src="https://www.matematica.pt/util/calculadora-teorema-pitagoras.php"></iframe>

                <button class="close-button" onclick="toggleGame('p2')">
                    Fechar
                </button>
            </div>

            <p>Ajuda no estudo de triângulos retângulos.</p>
        </div>

    </section>

    <script>
        function toggleGame(id) {
            let game = document.getElementById(id);

            game.style.display =
                game.style.display === "block"
                ? "none"
                : "block";
        }
    </script>

    <footer>
        <p>© 2026 MATH LAB</p>
    </footer>

</body>
</html>
